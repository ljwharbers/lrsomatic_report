name: Container

# Publishes the tool as a container so downstream pipelines can pull it instead of vendoring
# this source tree. Two artefacts, because Nextflow under Singularity/Apptainer wants a native
# SIF and everything else wants an OCI image:
#   ghcr.io/ljwharbers/lrsomatic-report:<version>
#   oras://ghcr.io/ljwharbers/lrsomatic-report-sif:<version>
#
# A pull request builds and smoke-tests the image without pushing anything, so a broken
# Dockerfile is caught before a tag publishes it. Only a v* tag publishes.
#
# No floating tags: consumers pin an exact version, and a mutable tag would quietly change
# what a "reproducible" pipeline run executes.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - "container/**"
      - "recipe/**"
      - "VERSION"
      - "bin/**"
      - "R/**"
      - "templates/**"
      - "assets/**"
      - ".github/workflows/container.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v1.5.0"
        required: true

env:
  IMAGE: ghcr.io/ljwharbers/lrsomatic-report
  SIF_IMAGE: ghcr.io/ljwharbers/lrsomatic-report-sif

jobs:
  # Build and smoke-test without publishing. This is the job that makes merging safe.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the image deps match the conda recipe
        run: python3 container/check_deps.py

      # No-op until the tag exists, so the release PR skips it and the PR that records the
      # digest is checked. That window is where a wrong sha256 has slipped through before.
      - name: Check the recipe sha256 against the release tarball
        run: container/check_sha256.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: lrsomatic-report:pr
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: container/smoke_test.sh lrsomatic-report:pr "$(cat VERSION)"

  build-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Derive the version and check it against VERSION
        id: ver
        run: |
          set -euo pipefail
          ref="${{ inputs.tag || github.ref_name }}"
          version="${ref#v}"
          # The tag, the VERSION file and what render_report.R reports must be one thing.
          # This is the check that stops a release shipping the previous version string.
          if [[ "$(cat VERSION)" != "$version" ]]; then
            echo "::error::VERSION says $(cat VERSION) but the tag says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the image deps match the conda recipe
        run: python3 container/check_deps.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          # No `load:` here -- the image is in the registry, so the smoke test pulls it.
          # Combining push with load trips buildx's docker-exporter limitation.
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
          build-args: VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: container/smoke_test.sh "${IMAGE}:${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.version }}"

  build-sif:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.build-push.outputs.version }}
    steps:
      # The fixture below; checked out at the tag being built, not at main
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.4

      - name: Build the SIF from the pushed OCI image
        env:
          APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
          APPTAINER_DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apptainer build lrsomatic-report.sif "docker://${IMAGE}:${VERSION}"
          ls -lh lrsomatic-report.sif

      # This is the artefact the pipeline actually runs on the cluster, and apptainer is not
      # docker: it ignores ENTRYPOINT, runs as the invoking uid and does not inherit the
      # caller's environment the same way. So it gets a real render of its own rather than a
      # couple of --version calls.
      - name: Smoke test the SIF
        run: |
          set -euo pipefail
          apptainer exec lrsomatic-report.sif render_report.R --version | tee v.txt
          grep -qx "${VERSION}" v.txt
          # Nextflow's task monitor calls ps inside the container
          apptainer exec lrsomatic-report.sif ps --version
          # The wrapper, not the environment, is what supplies QUARTO_SHARE_PATH: it is
          # deliberately not an ENV var, because quarto's other seven variables cannot be.
          apptainer exec lrsomatic-report.sif bash -c \
            'for h in /opt/conda/etc/conda/activate.d/*.sh; do . "$h"; done; test -d "$QUARTO_SHARE_PATH"'

          mkdir -p work/sample_dir
          cp tests/fixtures/test_SOMATIC_VEP.vcf.gz work/sample_dir/
          cd work
          export HOME="$PWD" TMPDIR="$PWD"
          apptainer exec --pwd "$PWD" ../lrsomatic-report.sif render_report.R \
              --sample-dir sample_dir \
              --sample-id smoke \
              --sex male \
              --reference auto \
              --output smoke_report.html
          test -s smoke_report.html
          # The fixture carries a TP53 variant; an empty report renders cleanly without it
          grep -q TP53 smoke_report.html

      - name: Push the SIF to GHCR via ORAS
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | apptainer remote login --username "${{ github.actor }}" --password-stdin oras://ghcr.io
          apptainer push lrsomatic-report.sif "oras://${SIF_IMAGE}:${VERSION}"
          echo "pushed oras://${SIF_IMAGE}:${VERSION}"
