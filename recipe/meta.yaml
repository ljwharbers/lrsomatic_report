{% set version = "2.1.1" %}

package:
  name: lrsomatic-report
  version: {{ version }}

source:
  url: https://github.com/ljwharbers/lrsomatic_report/archive/refs/tags/v{{ version }}.tar.gz
  # Recorded after the tag is cut, in a follow-up commit; container/check_sha256.sh verifies it.
  sha256: 960c4056bc201ff3c57e0a79ece26c1fc75177a69758e9787559f84c2d3ea53c

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage("lrsomatic-report", max_pin="x") }}

requirements:
  run:
    - r-base
    - quarto
    - r-quarto
    - r-data.table
    - r-dplyr
    - r-dt
    - r-htmltools
    - r-optparse
    - r-yaml
    - r-ggplot2
    - r-svglite
    - r-knitr
    - r-r.utils
    - r-circlize
    - r-base64enc

test:
  commands:
    - render_report.R --help
    - test "$(render_report.R --version)" = "{{ version }}"

about:
  home: https://github.com/ljwharbers/lrsomatic_report
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Standalone R/Quarto reporting tool for the LRSomatic long-read somatic variant calling pipeline.
  dev_url: https://github.com/ljwharbers/lrsomatic_report

extra:
  recipe-maintainers:
    - ljwharbers
