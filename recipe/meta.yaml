{% set version = "2.0.0rc1" %}

package:
  name: lrsomatic-report
  version: {{ version }}

source:
  url: https://github.com/ljwharbers/lrsomatic_report/archive/refs/tags/v{{ version }}.tar.gz
  # Still the v1.6.1 tarball's digest: the v{{ version }} one can only be recorded after the
  # tag is cut, in a follow-up commit (container/check_sha256.sh skips until the tag exists).
  sha256: 60f805619c7c38d6f3dfd81ed684729b69c23539638bcf24f22d4ffe577330ad

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage("lrsomatic-report", max_pin="x") }}

requirements:
  run:
    - r-base
    - quarto
    - r-quarto
    - r-data.table
    - r-dplyr
    - r-dt
    - r-htmltools
    - r-optparse
    - r-yaml
    - r-ggplot2
    - r-svglite
    - r-knitr
    - r-r.utils
    - r-circlize
    - r-base64enc

test:
  commands:
    - render_report.R --help
    - test "$(render_report.R --version)" = "{{ version }}"

about:
  home: https://github.com/ljwharbers/lrsomatic_report
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Standalone R/Quarto reporting tool for the LRSomatic long-read somatic variant calling pipeline.
  dev_url: https://github.com/ljwharbers/lrsomatic_report

extra:
  recipe-maintainers:
    - ljwharbers
